<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- NEW NAME HERE -->
    <title>Trap Quest - Mobile Edition</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #111;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            font-family: 'Segoe UI', sans-serif;
            color: white;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        #gameContainer {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
        }

        canvas {
            display: block;
            background-color: #eebb55;
            width: 100%;
            height: 100%;
            object-fit: contain; 
            max-width: 100%;
            max-height: 100%;
            aspect-ratio: 2/1;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }

        #uiLayer {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            z-index: 10;
        }

        /* --- START SCREEN --- */
        #startScreen {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(135deg, #ff4e50, #f9d423); /* New unique background color */
            z-index: 200;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .play-btn {
            background: white;
            color: #d32f2f;
            border: none;
            padding: 20px 50px;
            font-size: 30px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            transition: transform 0.2s;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .play-btn:active { transform: scale(0.95); }

        .game-title {
            font-size: 70px;
            font-weight: 900;
            color: white;
            text-shadow: 5px 5px 0px rgba(0,0,0,0.2);
            margin-bottom: 40px;
            font-family: 'Arial Black', sans-serif;
            letter-spacing: -2px;
        }

        /* --- SKIP BONUS SCREEN --- */
        #skipScreen {
            display: none;
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 150;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .skip-btn {
            background: linear-gradient(to bottom, #ffd700, #ff8c00);
            border: 4px solid white;
            color: white;
            padding: 20px 40px;
            font-size: 24px;
            font-weight: bold;
            border-radius: 15px;
            cursor: pointer;
            text-shadow: 1px 1px 2px black;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.6);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        /* Top Bar */
        .top-bar {
            display: flex;
            justify-content: center;
            gap: 10px;
            padding: 10px;
            pointer-events: auto;
            opacity: 0.5;
            transition: opacity 0.3s;
        }
        .top-bar:hover { opacity: 1; }

        .ui-btn {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255,255,255,0.2);
            color: rgba(255, 255, 255, 0.7);
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
        }

        #levelIndicator { color: #ffd700; border-color: #ffd700; }

        /* Controls Area */
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding: 15px 30px;
            width: 100%;
            box-sizing: border-box;
            pointer-events: auto;
        }

        /* Buttons */
        .btn {
            background: transparent; 
            border: 2px solid rgba(255, 255, 255, 0.15); 
            color: rgba(255, 255, 255, 0.3); 
            width: 55px;
            height: 55px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            cursor: pointer;
            backdrop-filter: none; 
            -webkit-backdrop-filter: none;
            transition: transform 0.1s, background 0.2s;
        }
        
        .btn:active {
            background: rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.6);
            transform: scale(0.90);
        }

        .d-pad { display: flex; gap: 15px; }

        /* Menu Styling */
        #levelMenu {
            display: none;
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 100;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        #menuContent {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            padding: 15px;
            max-height: 80vh;
            overflow-y: auto;
        }

        .lvl-btn {
            background: #333;
            border: 1px solid #666;
            color: white;
            width: 50px; height: 50px;
            display: flex; justify-content: center; align-items: center;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }
        .lvl-btn.done { background: #28a745; border-color: #4cd137; }
        .lvl-btn.skip { background: #dc3545; border-color: #ff6b6b; }
        .lvl-btn.active { border: 2px solid yellow; background: #555; }
        
    </style>
</head>
<body>

    <!-- START SCREEN WITH NEW NAME -->
    <div id="startScreen">
        <div class="game-title">TRAP QUEST</div>
        <button class="play-btn" onclick="startGame()">▶ PLAY GAME</button>
    </div>

    <!-- SKIP PROMPT SCREEN -->
    <div id="skipScreen">
        <h2 style="color:white; margin-bottom: 20px;">Too Hard?</h2>
        <button class="skip-btn" onclick="confirmSkip()">⏩ SKIP BONUS</button>
    </div>

    <div id="gameContainer">
        <canvas id="gameCanvas" width="800" height="400"></canvas>

        <div id="uiLayer">
            <div class="top-bar">
                <button id="levelIndicator" class="ui-btn" onclick="toggleMenu()">Lvl 1</button>
                <button id="soundBtn" class="ui-btn" onclick="toggleAudio()">🔊 ON</button>
                <button class="ui-btn" onclick="activateLandscape()">⟳ Rotate</button>
                <button class="ui-btn" onclick="toggleFullScreen()">⛶ Full</button>
            </div>

            <div class="controls">
                <div class="d-pad">
                    <div class="btn" id="lBtn">⬅️</div>
                    <div class="btn" id="rBtn">➡️</div>
                </div>
                <div class="btn" id="jBtn">⬆️</div>
            </div>
        </div>
    </div>

    <div id="levelMenu">
        <h2 style="color:#eebb55; margin-bottom: 15px;">SELECT LEVEL</h2>
        <div id="menuContent"></div>
        <button class="ui-btn" onclick="toggleMenu()" style="margin-top:20px; background: #fff; color:#000; padding: 10px 20px;">CLOSE</button>
    </div>

<script>
    // --- ANDROID BRIDGE HELPER ---
    function sendToAndroid(eventName) {
        if (window.Android && typeof Android[eventName] === "function") {
            Android[eventName]();
        }
    }

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    // --- VARIABLES ---
    let currentLevel = 1;
    let maxLevels = 40;
    let maxUnlocked = 1;
    let deathsInLevel = 0;
    let levelStatus = {}; 
    let isGameRunning = false;
    let isMenuOpen = false;

    // --- CHARACTER SIZE INCREASED (50x50) ---
    // Previously 40, now 50 for better mobile visibility
    let player = { x: 50, y: 300, w: 50, h: 50, vx: 0, vy: 0, grounded: false, dead: false };
    
    let keys = {};
    let platforms = [];
    let spikes = [];
    
    let particles = []; 

    // --- DOOR SIZE INCREASED (60x90) ---
    // Adjusted to match new player size
    let door = { x: 0, y: 0, w: 60, h: 90 };
    
    let bgColor = "#eebb55";
    let frameCount = 0;

    const GRAVITY = 0.6;
    const FRICTION = 0.8;
    const JUMP_FORCE = -11;

    // --- AUDIO SYSTEM ---
    let audioCtx = null;
    let isMuted = false;
    let bgmInterval = null;

    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            startBGM();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
    }

    function toggleAudio() {
        if(!audioCtx) initAudio();
        isMuted = !isMuted;
        const btn = document.getElementById('soundBtn');
        if(isMuted) {
            btn.innerText = "🔇 OFF";
            if(audioCtx) audioCtx.suspend();
        } else {
            btn.innerText = "🔊 ON";
            if(audioCtx) audioCtx.resume();
        }
    }

    function playSound(type) {
        if(isMuted || !audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        const now = audioCtx.currentTime;

        if (type === 'jump') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(150, now);
            osc.frequency.exponentialRampToValueAtTime(600, now + 0.1);
            gain.gain.setValueAtTime(0.1, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
            osc.start(now);
            osc.stop(now + 0.1);
        } else if (type === 'die') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(200, now);
            osc.frequency.exponentialRampToValueAtTime(50, now + 0.3);
            gain.gain.setValueAtTime(0.1, now);
            gain.gain.linearRampToValueAtTime(0, now + 0.3);
            osc.start(now);
            osc.stop(now + 0.3);
        } else if (type === 'win') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(400, now);
            osc.frequency.setValueAtTime(600, now + 0.1);
            osc.frequency.setValueAtTime(800, now + 0.2);
            gain.gain.setValueAtTime(0.1, now);
            gain.gain.linearRampToValueAtTime(0, now + 0.5);
            osc.start(now);
            osc.stop(now + 0.5);
        }
    }

    function startBGM() {
        if(bgmInterval) clearInterval(bgmInterval);
        let note = 0;
        const notes = [110, 130, 146, 130, 110, 130, 146, 164]; 
        bgmInterval = setInterval(() => {
            if(isMuted || !audioCtx || audioCtx.state === 'suspended') return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.type = 'triangle';
            osc.frequency.value = notes[note % notes.length];
            gain.gain.value = 0.03; 
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.2);
            note++;
        }, 400); 
    }

    // --- GAME FLOW LOGIC ---

    function startGame() {
        sendToAndroid("onPlayVideoAd");
        document.getElementById('startScreen').style.display = 'none';
        initAudio();
        isGameRunning = true;
        loadLevel(1);
        loop();
    }

    function confirmSkip() {
        sendToAndroid("onSkipRewardAd");
        document.getElementById('skipScreen').style.display = 'none';
        levelStatus[currentLevel] = 'skip';
        isGameRunning = true;
        loadLevel(currentLevel + 1);
    }

    function createDust(x, y) {
        for(let i=0; i<6; i++) {
            particles.push({
                x: x, y: y,
                vx: (Math.random() - 0.5) * 4,
                vy: Math.random() * -1.5,
                size: Math.random() * 6 + 2,
                life: 1.0, decay: Math.random() * 0.05 + 0.02
            });
        }
    }

    // --- LEVEL BUILDER (Updated with Larger Door) ---
    function buildLevel(n) {
        platforms = [];
        spikes = [];
        bgColor = "#eebb55";
        
        // Updated Door Dimensions
        let dW = 60; 
        let dH = 90;

        switch(n) {
            case 1: platforms.push({x:0, y:350, w:800, h:50}); door = {x:700, y:260, w:dW, h:dH}; break;
            case 2: bgColor = "#88cc88"; platforms.push({x:0, y:350, w:300, h:50}, {x:400, y:350, w:400, h:50}); door = {x:700, y:260, w:dW, h:dH}; break;
            case 3: bgColor = "#88aacc"; platforms.push({x:0, y:350, w:250, h:50}, {x:550, y:350, w:250, h:50}); platforms.push({x:250, y:350, w:300, h:50, type:'fall'}); door = {x:700, y:260, w:dW, h:dH}; break;
            case 4: bgColor = "#cc8888"; platforms.push({x:0, y:350, w:800, h:50}); spikes.push({x:350, y:320, w:30, h:30}, {x:500, y:320, w:30, h:30}); door = {x:700, y:260, w:dW, h:dH}; break;
            case 5: bgColor = "#ccaadd"; platforms.push({x:0, y:350, w:800, h:50}); spikes.push({x:300, y:350, w:30, h:30, hidden:true, tx:200}); door = {x:700, y:260, w:dW, h:dH}; break;
            case 6: bgColor = "#ddaa55"; platforms.push({x:0, y:350, w:200, h:50}, {x:600, y:350, w:200, h:50}); platforms.push({x:200, y:350, w:100, h:20, type:'move_h', min:200, max:500, spd:3, dir:1}); door = {x:700, y:260, w:dW, h:dH}; break;
            case 7: bgColor = "#aaa"; platforms.push({x:0, y:350, w:800, h:50}, {x:300, y:150, w:200, h:50}); spikes.push({x:350, y:200, w:30, h:30, rot:true}); door = {x:700, y:260, w:dW, h:dH}; break;
            case 8: bgColor = "#5aa"; platforms.push({x:0, y:350, w:200, h:50}, {x:600, y:350, w:200, h:50}); platforms.push({x:200, y:350, w:400, h:50, type:'vanish'}); door = {x:750, y:260, w:dW, h:dH}; break;
            case 9: bgColor = "#a55"; platforms.push({x:0, y:350, w:800, h:50}); spikes.push({x:400, y:320, w:30, h:30}); door = {x:600, y:260, w:dW, h:dH, type:'run', spd:2}; break;
            case 10: bgColor = "#333"; platforms.push({x:0, y:350, w:100, h:50}, {x:600, y:200, w:200, h:50}); platforms.push({x:200, y:300, w:50, h:20}, {x:400, y:250, w:50, h:20}); spikes.push({x:220, y:-50, w:30, h:30, type:'drop', tx:150}); spikes.push({x:420, y:-50, w:30, h:30, type:'drop', tx:350}); door = {x:700, y:120, w:dW, h:dH}; break;
            
            default:
                bgColor = "#222"; 
                platforms.push({x:0, y:350, w:100, h:50}, {x:700, y:350, w:100, h:50});
                let pType = Math.random() > 0.7 ? 'vanish' : 'normal';
                platforms.push({x:200, y:350, w:100, h:50, type: pType});
                platforms.push({x:400, y:250, w:100, h:20, type:'move_h', min:300, max:500, spd:3, dir:1});
                spikes.push({x:300, y:320, w:30, h:30});
                if(n > 20) spikes.push({x:500, y:320, w:30, h:30, hidden:true, tx:450});
                door = {x:720, y:260, w:dW, h:dH};
                if(n === 40) {
                    platforms = []; spikes = [];
                    platforms.push({x:0, y:350, w:100, h:50}, {x:650, y:350, w:150, h:50});
                    platforms.push({x:150, y:350, w:450, h:50, type:'fall'});
                    spikes.push({x:300, y:-50, w:30, h:30, type:'drop', tx:200});
                    spikes.push({x:500, y:-50, w:30, h:30, type:'drop', tx:400});
                    door = {x:700, y:260, w:dW, h:dH};
                }
                break;
        }
    }

    // --- GAME ENGINE ---
    function loadLevel(n) {
        if(n > maxLevels) { alert("GAME COMPLETED!"); n = 1; levelStatus = {}; maxUnlocked = 1; }
        currentLevel = n;
        if(n > maxUnlocked) maxUnlocked = n;
        deathsInLevel = 0;
        buildLevel(n);
        resetPlayer();
        updateUI();
    }

    function resetPlayer() {
        player.x = 50; player.y = 200; player.vx = 0; player.vy = 0; player.dead = false;
        // Updated Player Size
        player.w = 50; player.h = 50;
        buildLevel(currentLevel);
    }

    function update() {
        if (!isGameRunning) return;
        frameCount++;

        if (!player.dead) {
            if (keys['ArrowRight'] || keys['d']) player.vx += 1;
            if (keys['ArrowLeft'] || keys['a']) player.vx -= 1;
            if ((keys['ArrowUp'] || keys['w'] || keys[' ']) && player.grounded) {
                player.vy = JUMP_FORCE;
                player.grounded = false;
                playSound('jump');
                createDust(player.x + player.w/2, player.y + player.h);
            }
            player.vx *= FRICTION;
            player.vy += GRAVITY;
            player.x += player.vx;
            player.y += player.vy;
        }

        platforms.forEach(p => {
            if (p.type === 'fall' && player.x > p.x - 50 && player.grounded && !player.dead) p.y += 3;
            if (p.type === 'move_h') { p.x += p.spd * p.dir; if (p.x > p.max || p.x < p.min) p.dir *= -1; }
            if (p.type === 'vanish' && player.x > p.x - 20) { p.w -= 5; if(p.w < 0) p.w = 0; }
        });

        spikes.forEach(s => {
            if (s.hidden && player.x > s.tx) { s.hidden = false; s.y = 320; }
            if (s.type === 'drop' && player.x > s.tx) s.y += 7;
        });

        if (door.type === 'run' && player.x > door.x - 120 && door.x < 750) door.x += door.spd;

        player.grounded = false;
        platforms.forEach(p => {
            if(p.w <= 0) return;
            let dir = colCheck(player, p);
            if (dir === "b") { player.grounded = true; if (p.type === 'move_h') player.x += p.spd * p.dir; }
        });

        for(let i=particles.length-1; i>=0; i--) {
            let p = particles[i];
            p.x += p.vx; p.y += p.vy; p.life -= p.decay;
            if(p.life <= 0) particles.splice(i, 1);
        }

        if (!player.dead) {
            spikes.forEach(s => { if (!s.hidden && colCheck(player, s)) die(); });
            if (player.y > canvas.height) die();
            if (player.x < 0) player.x = 0;
            if (player.x > canvas.width) player.x = canvas.width;
        }

        if (colCheck(player, door) && !player.dead) {
            playSound('win');
            sendToAndroid("onLevelWin");
            levelStatus[currentLevel] = 'done';
            loadLevel(currentLevel + 1);
        }
    }

    function die() {
        if(player.dead) return;
        player.dead = true;
        playSound('die');
        deathsInLevel++;
        sendToAndroid("onGameOver");
        updateUI();
        
        if (deathsInLevel >= 5) {
            isGameRunning = false;
            document.getElementById('skipScreen').style.display = 'flex';
        } else {
            setTimeout(resetPlayer, 300);
        }
    }

    function colCheck(shapeA, shapeB) {
        let vX = (shapeA.x + (shapeA.w / 2)) - (shapeB.x + (shapeB.w / 2));
        let vY = (shapeA.y + (shapeA.h / 2)) - (shapeB.y + (shapeB.h / 2));
        let hWidths = (shapeA.w / 2) + (shapeB.w / 2);
        let hHeights = (shapeA.h / 2) + (shapeB.h / 2);
        if (Math.abs(vX) < hWidths && Math.abs(vY) < hHeights) {
            let oX = hWidths - Math.abs(vX);
            let oY = hHeights - Math.abs(vY);
            if (oX >= oY) {
                if (vY > 0) { shapeA.y += oY; shapeA.vy = 0; return "t"; } 
                else { shapeA.y -= oY; shapeA.vy = 0; return "b"; }
            } else {
                if (vX > 0) { shapeA.x += oX; shapeA.vx = 0; return "l"; } 
                else { shapeA.x -= oX; shapeA.vx = 0; return "r"; }
            }
        }
        return null;
    }

    function drawClouds() {
        ctx.fillStyle = "rgba(255, 255, 255, 0.2)";
        ctx.beginPath(); ctx.arc(100, 80, 40, 0, Math.PI * 2); ctx.arc(150, 80, 50, 0, Math.PI * 2); ctx.arc(200, 80, 40, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(500, 120, 30, 0, Math.PI * 2); ctx.arc(540, 110, 40, 0, Math.PI * 2); ctx.arc(580, 120, 30, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(700, 60, 40, 0, Math.PI * 2); ctx.arc(750, 50, 50, 0, Math.PI * 2); ctx.fill();
    }

    function drawCharacter(p) {
        if(p.dead) return;
        let centerX = p.x + p.w / 2;
        let centerY = p.y + p.h / 2;
        let walkOffset = 0;
        if(Math.abs(p.vx) > 0.1 && p.grounded) walkOffset = Math.sin(frameCount * 0.5) * 6;
        ctx.fillStyle = "#ff0000"; 
        ctx.lineWidth = 4;
        ctx.strokeStyle = "#cc0000";
        ctx.beginPath();
        // Legs scaled for bigger character
        ctx.moveTo(centerX - 8, centerY + 8); ctx.lineTo(centerX - 8 - walkOffset, p.y + p.h);
        ctx.moveTo(centerX + 8, centerY + 8); ctx.lineTo(centerX + 8 + walkOffset, p.y + p.h);
        ctx.stroke();
        
        // Body (Bigger)
        ctx.fillRect(centerX - 12, centerY - 10, 24, 28);
        
        // Arms
        ctx.beginPath();
        ctx.moveTo(centerX - 12, centerY - 4); ctx.lineTo(centerX - 20 - walkOffset, centerY + 14);
        ctx.moveTo(centerX + 12, centerY - 4); ctx.lineTo(centerX + 20 + walkOffset, centerY + 14);
        ctx.stroke();
        
        // Head
        ctx.fillStyle = "#ff4444";
        ctx.beginPath(); ctx.arc(centerX, p.y + 4, 15, 0, Math.PI * 2); ctx.fill();
        
        // Eyes
        ctx.fillStyle = "white";
        let dir = p.vx >= 0 ? 1 : -1;
        ctx.fillRect(centerX + (4 * dir), p.y - 2, 5, 5);
        ctx.fillRect(centerX + (10 * dir), p.y - 2, 5, 5);
    }

    function drawDoor(d) {
        let glow = Math.sin(frameCount * 0.1) * 5;
        ctx.fillStyle = "rgba(255, 255, 255, 0.3)";
        ctx.beginPath(); ctx.ellipse(d.x + d.w/2, d.y + d.h/2, d.w/2 + 5 + glow, d.h/2 + 5 + glow, 0, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = "#333";
        ctx.beginPath(); ctx.moveTo(d.x, d.y + d.h); ctx.lineTo(d.x, d.y + 20); ctx.bezierCurveTo(d.x, d.y - 10, d.x + d.w, d.y - 10, d.x + d.w, d.y + 20); ctx.lineTo(d.x + d.w, d.y + d.h); ctx.fill();
        let grd = ctx.createLinearGradient(d.x, d.y, d.x, d.y + d.h);
        grd.addColorStop(0, "#00ffff"); grd.addColorStop(1, "#0000ff");
        ctx.fillStyle = grd;
        ctx.beginPath(); ctx.moveTo(d.x + 5, d.y + d.h); ctx.lineTo(d.x + 5, d.y + 20); ctx.bezierCurveTo(d.x + 5, d.y, d.x + d.w - 5, d.y, d.x + d.w - 5, d.y + 20); ctx.lineTo(d.x + d.w - 5, d.y + d.h); ctx.fill();
    }

    function draw() {
        ctx.fillStyle = bgColor; ctx.fillRect(0, 0, canvas.width, canvas.height);
        drawClouds();
        ctx.fillStyle = "#5d4a2a";
        platforms.forEach(p => {
            ctx.fillRect(p.x, p.y, p.w, p.h);
            ctx.fillStyle = "#4a6b2a"; ctx.fillRect(p.x, p.y, p.w, 8); ctx.fillStyle = "#5d4a2a";
        });
        ctx.fillStyle = "#e00";
        spikes.forEach(s => {
            if(!s.hidden) {
                ctx.beginPath();
                if(s.rot) { ctx.moveTo(s.x, s.y); ctx.moveTo(s.x+s.w/2, s.y+s.h); ctx.moveTo(s.x+s.w, s.y); }
                else { ctx.moveTo(s.x, s.y+s.h); ctx.moveTo(s.x+s.w/2, s.y); ctx.moveTo(s.x+s.w, s.y+s.h); }
                ctx.fill();
            }
        });
        drawDoor(door);
        ctx.fillStyle = "rgba(255, 255, 255, 0.6)";
        particles.forEach(p => {
            ctx.globalAlpha = p.life;
            ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
            ctx.globalAlpha = 1.0;
        });
        drawCharacter(player);
        requestAnimationFrame(loop);
    }

    function loop() { update(); draw(); }

    function updateUI() { document.getElementById('levelIndicator').innerText = "Lvl " + currentLevel; }

    window.toggleMenu = function() {
        const menu = document.getElementById('levelMenu');
        const grid = document.getElementById('menuContent');
        isMenuOpen = !isMenuOpen;
        if(isMenuOpen) {
            isGameRunning = false; menu.style.display = 'flex'; grid.innerHTML = '';
            for(let i=1; i<=maxUnlocked; i++) {
                let btn = document.createElement('div');
                btn.className = 'lvl-btn'; btn.innerText = i;
                if(levelStatus[i] === 'done') btn.classList.add('done');
                if(levelStatus[i] === 'skip') btn.classList.add('skip');
                if(i === currentLevel) btn.classList.add('active');
                btn.onclick = () => { toggleMenu(); loadLevel(i); };
                grid.appendChild(btn);
            }
        } else { isGameRunning = true; menu.style.display = 'none'; }
    };

    window.toggleFullScreen = function() {
        if (!document.fullscreenElement) { document.documentElement.requestFullscreen().catch(err => console.log(err)); } 
        else { if (document.exitFullscreen) document.exitFullscreen(); }
    };

    window.activateLandscape = function() {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().then(() => {
                if(screen.orientation && screen.orientation.lock) { screen.orientation.lock('landscape').catch(e => console.log(e)); }
            });
        } else {
            if(screen.orientation && screen.orientation.lock) { screen.orientation.lock('landscape').catch(e => console.log(e)); }
        }
    };

    window.addEventListener('keydown', e => keys[e.key] = true);
    window.addEventListener('keyup', e => keys[e.key] = false);

    const lBtn = document.getElementById('lBtn');
    const rBtn = document.getElementById('rBtn');
    const jBtn = document.getElementById('jBtn');

    const bindTouch = (el, key) => {
        el.addEventListener('touchstart', (e) => { e.preventDefault(); keys[key] = true; });
        el.addEventListener('touchend', (e) => { e.preventDefault(); keys[key] = false; });
        el.addEventListener('mousedown', () => keys[key] = true);
        el.addEventListener('mouseup', () => keys[key] = false);
    };

    bindTouch(lBtn, 'ArrowLeft');
    bindTouch(rBtn, 'ArrowRight');
    bindTouch(jBtn, 'ArrowUp');

</script>
</body>
</html>
